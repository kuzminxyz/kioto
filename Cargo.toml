[package]
name = "shinobi"
version = "0.1.0"
edition = "2024"

[dependencies]
# arkworks dependencies
ark-std = "0.6.0"
ark-ff = "0.6.0"
ark-poly = "0.6.0"
ark-bls12-381 = "0.6.0"
ark-ec = "0.6.0"
ark-serialize = "0.6.0"

sha2 = "0.10"

thiserror = "2.0.18"

serde = { version = "1", features = ["derive"], optional = true }
const-hex = { version = "1.19", features = ["serde"], optional = true }

[features]
serde = ["dep:serde", "dep:const-hex"]

[dev-dependencies]
serde_json = "1"
